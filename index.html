<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO meta — updated dynamically per page by the Seo component -->
    <title>Photovani - Photography Services | Maternity, Couples, Family & Event Photography</title>
    <meta name="description" content="Photovani - Photography Services. Professional photography studio specializing in maternity, couples, family, individual portraits, school events, birthday parties, and event photography. Book your session today." />
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Photovani - Photography Services" />
    <meta property="og:description" content="Photovani - Photography Services. Professional photography studio specializing in maternity, couples, family, individual portraits, school events, birthday parties, and event photography." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Photovani" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Preconnect to Pexels image CDN -->
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <!-- Fonts: preconnect + stylesheet for Cormorant Garamond and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
